<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="/static/icon-192.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Revvio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; align-items: center; }
        .card { border: none; border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
        .brand { background: linear-gradient(135deg, #667eea, #764ba2); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
        .btn-submit { background: linear-gradient(135deg, #667eea, #764ba2); border: none; color: white; padding: 12px; font-size: 16px; font-weight: 700; }
        .btn-submit:hover { color: white; opacity: 0.9; }
        .form-control:focus { border-color: #667eea; box-shadow: 0 0 0 0.2rem rgba(102,126,234,0.25); }
    </style>
</head>
<body>
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5 col-sm-8">
            <div class="card p-5">
                <div class="text-center mb-4">
                    <h2 class="fw-bold brand">Revvio</h2>
                    <p class="text-muted">Reset your password</p>
                </div>

                {% with messages = get_flashed_messages(with_categories=true) %}
                    {% if messages %}{% for category, message in messages %}
                        <div class="alert alert-{{ 'danger' if category == 'error' else 'success' }} alert-dismissible fade show">
                            {{ message }}<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        </div>
                    {% endfor %}{% endif %}
                {% endwith %}

                <p class="text-muted small mb-4">Enter your email address and we'll send you a temporary password.</p>

                <form method="POST">
                    <div class="mb-4">
                        <label class="form-label fw-bold">Email Address</label>
                        <input type="email" class="form-control form-control-lg" name="email" placeholder="you@yourbusiness.com" required autofocus>
                    </div>
                    <button type="submit" class="btn btn-submit w-100 btn-lg mb-3">Send Temporary Password</button>
                </form>

                <div class="text-center">
                    <a href="/login" class="text-muted small">← Back to Login</a>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
