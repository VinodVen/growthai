<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="/static/icon-192.png">
    <link rel="shortcut icon" href="/static/icon-192.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Revvio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); min-height: 100vh; display: flex; align-items: center; }
        .card { border: none; border-radius: 15px; box-shadow: 0 20px 40px rgba(0,0,0,0.4); max-width: 400px; width: 100%; margin: auto; }
        .btn-admin { background: linear-gradient(135deg, #667eea, #764ba2); color: white; border: none; }
        .btn-admin:hover { color: white; opacity: 0.9; }
        .admin-badge { background: linear-gradient(135deg, #f6d365, #fda085); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 900; }
    </style>
</head>
<body>
<div class="container">
    <div class="card p-5">
        <div class="text-center mb-4">
            <h2 class="fw-bold mb-1">Revvio</h2>
            <span class="admin-badge fs-5">Admin Portal</span>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ 'danger' if category == 'error' else 'success' }} alert-dismissible fade show">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST">
            <div class="mb-3">
                <label class="form-label fw-bold">Admin Password</label>
                <input type="password" class="form-control form-control-lg" name="password" autofocus required>
            </div>
            <button type="submit" class="btn btn-admin w-100 btn-lg fw-bold">Login</button>
        </form>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
