<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="/static/icon-192.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Loyalty Scanner — {{ business.business_name }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body { background: #09090f; color: #e2e2f0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; margin: 0; }
        .topbar { background: rgba(0,0,0,0.5); border-bottom: 1px solid rgba(255,255,255,0.07); padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; }
        .brand { font-size: 1.1rem; font-weight: 800; color: #fff; }

        .scanner-wrap { max-width: 480px; margin: 0 auto; padding: 24px 16px 60px; }
        .scanner-title { font-size: 1.3rem; font-weight: 800; color: #fff; text-align: center; margin-bottom: 6px; }
        .scanner-sub { color: #6b6b8a; font-size: 0.83rem; text-align: center; margin-bottom: 24px; }

        #camera-box {
            position: relative; width: 100%; padding-top: 100%;
            background: #0d0d1a; border-radius: 16px; overflow: hidden;
            border: 2px solid rgba(124,111,255,0.3);
        }
        #video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
        #canvas { display: none; }

        .scan-overlay {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 60%; height: 60%; border: 3px solid #7c6fff;
            border-radius: 12px; pointer-events: none;
            box-shadow: 0 0 0 2000px rgba(0,0,0,0.35);
        }
        .scan-overlay::before, .scan-overlay::after {
            content: ''; position: absolute; width: 20px; height: 20px;
            border-color: #a78bfa; border-style: solid;
        }
        .scan-overlay::before { top: -3px; left: -3px; border-width: 3px 0 0 3px; border-radius: 4px 0 0 0; }
        .scan-overlay::after  { bottom: -3px; right: -3px; border-width: 0 3px 3px 0; border-radius: 0 0 4px 0; }

        .scan-line {
            position: absolute; top: 0; left: 0; right: 0; height: 2px;
            background: linear-gradient(90deg, transparent, #7c6fff, transparent);
            animation: scanAnim 2s linear infinite;
        }
        @keyframes scanAnim { 0% { top: 20%; } 50% { top: 80%; } 100% { top: 20%; } }

        #status-box { margin-top: 16px; border-radius: 12px; padding: 14px 18px; text-align: center; font-size: 0.9rem; font-weight: 600; min-height: 52px; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .status-idle    { background: rgba(255,255,255,0.04); color: #6b6b8a; }
        .status-ok      { background: rgba(34,197,94,0.12); border: 1px solid rgba(34,197,94,0.25); color: #4ade80; }
        .status-err     { background: rgba(248,113,113,0.12); border: 1px solid rgba(248,113,113,0.25); color: #f87171; }
        .status-scan    { background: rgba(124,111,255,0.12); border: 1px solid rgba(124,111,255,0.25); color: #a78bfa; }

        .result-card { background: #13131f; border: 1px solid rgba(255,255,255,0.07); border-radius: 14px; padding: 20px; margin-top: 16px; display: none; }
        .result-name { font-size: 1.3rem; font-weight: 800; color: #fff; }
        .result-meta { font-size: 0.82rem; color: #6b6b8a; margin-top: 2px; }
        .points-badge { background: linear-gradient(135deg, #7c6fff, #a855f7); color: #fff; font-size: 1rem; font-weight: 800; border-radius: 10px; padding: 8px 18px; display: inline-block; margin-top: 10px; }
        .visit-bar-wrap { margin-top: 14px; }
        .visit-bar-bg { background: rgba(255,255,255,0.07); border-radius: 20px; height: 8px; overflow: hidden; }
        .visit-bar-fill { background: linear-gradient(90deg, #7c6fff, #a855f7); height: 100%; border-radius: 20px; transition: width 0.6s ease; }
        .visit-label { font-size: 0.72rem; color: #6b6b8a; margin-top: 4px; display: flex; justify-content: space-between; }

        .btn-start { background: linear-gradient(135deg, #7c6fff, #a855f7); border: none; color: #fff; font-weight: 700; padding: 13px 30px; border-radius: 12px; font-size: 1rem; width: 100%; margin-top: 16px; cursor: pointer; }
        .btn-start:hover { opacity: 0.9; }
        .btn-manual { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #9090b0; border-radius: 10px; padding: 10px 20px; font-size: 0.85rem; width: 100%; margin-top: 10px; cursor: pointer; }
        .btn-manual:hover { background: rgba(255,255,255,0.09); color: #e2e2f0; }

        a.back-link { color: #6b6b8a; font-size: 0.82rem; text-decoration: none; }
        a.back-link:hover { color: #a78bfa; }

        /* Manual lookup */
        .manual-wrap { background: #13131f; border: 1px solid rgba(255,255,255,0.07); border-radius: 14px; padding: 20px; margin-top: 16px; display: none; }
        .ctrl { background: #1a1a2e; border: 1px solid rgba(255,255,255,0.1); color: #e2e2f0; border-radius: 8px; padding: 10px 14px; width: 100%; font-size: 0.9rem; }
        .ctrl:focus { outline: none; border-color: rgba(124,111,255,0.5); }
        .btn-lookup { background: rgba(124,111,255,0.15); border: 1px solid rgba(124,111,255,0.3); color: #a78bfa; border-radius: 8px; padding: 10px 20px; font-size: 0.88rem; font-weight: 700; cursor: pointer; margin-top: 8px; width: 100%; }
        .lookup-results { margin-top: 12px; }
        .lookup-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.04); cursor: pointer; }
        .lookup-row:last-child { border-bottom: none; }
        .lookup-row:hover { background: rgba(255,255,255,0.03); border-radius: 6px; padding-left: 8px; }
        .lookup-name { font-size: 0.88rem; font-weight: 700; color: #fff; }
        .lookup-contact { font-size: 0.74rem; color: #6b6b8a; }
        .btn-checkin-row { background: rgba(34,197,94,0.12); border: 1px solid rgba(34,197,94,0.25); color: #4ade80; border-radius: 6px; padding: 4px 12px; font-size: 0.75rem; font-weight: 700; cursor: pointer; }
    </style>
</head>
<body>
<div class="topbar">
    <span class="brand">📱 Loyalty Scanner</span>
    <a href="/dashboard" class="back-link"><i class="bi bi-arrow-left"></i> Dashboard</a>
</div>

<div class="scanner-wrap">
    <div class="scanner-title">Scan Customer QR Code</div>
    <div class="scanner-sub">Point camera at customer's loyalty QR code to log their visit</div>

    <div id="camera-box">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="canvas"></canvas>
        <div class="scan-overlay">
            <div class="scan-line"></div>
        </div>
    </div>

    <div id="status-box" class="status-idle">
        <i class="bi bi-camera"></i> Tap "Start Scanner" to activate camera
    </div>

    <div class="result-card" id="result-card">
        <div class="d-flex align-items-center gap-3">
            <div style="font-size:2.2rem;">👤</div>
            <div>
                <div class="result-name" id="r-name"></div>
                <div class="result-meta" id="r-contact"></div>
            </div>
        </div>
        <div class="points-badge" id="r-points">+10 pts</div>
        <div class="visit-bar-wrap">
            <div class="visit-bar-bg"><div class="visit-bar-fill" id="r-bar" style="width:0%"></div></div>
            <div class="visit-label"><span id="r-visits-label"></span><span id="r-reward-label"></span></div>
        </div>
    </div>

    <button class="btn-start" id="btn-start" onclick="startScanner()">
        <i class="bi bi-camera-fill"></i> Start Scanner
    </button>
    <button class="btn-manual" onclick="toggleManual()">
        <i class="bi bi-search"></i> Manual Lookup by Name / Phone
    </button>

    <!-- Manual lookup -->
    <div class="manual-wrap" id="manual-wrap">
        <input type="text" id="lookup-input" class="ctrl" placeholder="Type name, email or phone…" oninput="doLookup(this.value)">
        <div class="lookup-results" id="lookup-results"></div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
<script>
let scanning = false;
let stream = null;
let lastScanned = "";
let lastScannedAt = 0;

async function startScanner() {
    const btn = document.getElementById('btn-start');
    btn.disabled = true;
    btn.textContent = 'Starting…';
    try {
        stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } }
        });
        const video = document.getElementById('video');
        video.srcObject = stream;
        await video.play();
        scanning = true;
        btn.textContent = '⏹ Stop Scanner';
        btn.onclick = stopScanner;
        btn.disabled = false;
        setStatus('scan', '<i class="bi bi-qr-code-scan"></i> Scanning… hold QR code steady');
        requestAnimationFrame(tick);
    } catch(e) {
        setStatus('err', '<i class="bi bi-exclamation-triangle"></i> Camera access denied — check browser permissions');
        btn.textContent = 'Start Scanner';
        btn.onclick = startScanner;
        btn.disabled = false;
    }
}

function stopScanner() {
    scanning = false;
    if (stream) stream.getTracks().forEach(t => t.stop());
    const video = document.getElementById('video');
    video.srcObject = null;
    const btn = document.getElementById('btn-start');
    btn.textContent = 'Start Scanner';
    btn.onclick = startScanner;
    setStatus('idle', '<i class="bi bi-camera"></i> Scanner stopped');
}

function tick() {
    if (!scanning) return;
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    if (video.readyState === video.HAVE_ENOUGH_DATA) {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const code = jsQR(imageData.data, imageData.width, imageData.height, { inversionAttempts: "dontInvert" });
        if (code) {
            const now = Date.now();
            // Debounce — don't re-scan same code within 4 seconds
            if (code.data !== lastScanned || now - lastScannedAt > 4000) {
                lastScanned = code.data;
                lastScannedAt = now;
                handleScan(code.data);
            }
        }
    }
    requestAnimationFrame(tick);
}

async function handleScan(data) {
    // Expect URL like https://domain.com/checkin/<token>
    const match = data.match(/\/checkin\/([A-Za-z0-9_\-]+)/);
    if (!match) {
        setStatus('err', '<i class="bi bi-x-circle"></i> Not a valid Revvio loyalty QR code');
        return;
    }
    const token = match[1];
    setStatus('scan', '<i class="bi bi-hourglass-split"></i> Logging visit…');
    try {
        const res = await fetch(`/checkin-api/${token}`, { method: 'POST' });
        const data = await res.json();
        if (data.ok) {
            showResult(data);
            setStatus('ok', `<i class="bi bi-check-circle-fill"></i> ✅ ${data.name} checked in! +10 points`);
        } else {
            setStatus('err', `<i class="bi bi-x-circle"></i> ${data.error || 'Check-in failed'}`);
        }
    } catch(e) {
        setStatus('err', '<i class="bi bi-x-circle"></i> Network error — try again');
    }
}

function showResult(data) {
    const card = document.getElementById('result-card');
    card.style.display = 'block';
    document.getElementById('r-name').textContent = data.name;
    document.getElementById('r-contact').textContent = data.contact || '';
    document.getElementById('r-points').textContent = `${data.points} pts total · +10 this visit`;
    const rewardAt = data.reward_visits || 5;
    const visits = data.visits;
    const pct = Math.min(100, Math.round((visits % rewardAt) / rewardAt * 100));
    document.getElementById('r-bar').style.width = pct + '%';
    document.getElementById('r-visits-label').textContent = `${visits} visit${visits !== 1 ? 's' : ''}`;
    document.getElementById('r-reward-label').textContent = `Reward at ${rewardAt} visits`;
    card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function setStatus(type, html) {
    const box = document.getElementById('status-box');
    box.className = 'status-' + type;
    box.innerHTML = html;
}

function toggleManual() {
    const w = document.getElementById('manual-wrap');
    w.style.display = w.style.display === 'block' ? 'none' : 'block';
    if (w.style.display === 'block') document.getElementById('lookup-input').focus();
}

let lookupTimer = null;
function doLookup(q) {
    clearTimeout(lookupTimer);
    if (q.length < 2) { document.getElementById('lookup-results').innerHTML = ''; return; }
    lookupTimer = setTimeout(async () => {
        const res = await fetch(`/scanner/lookup?q=${encodeURIComponent(q)}`);
        const data = await res.json();
        const el = document.getElementById('lookup-results');
        if (!data.customers || data.customers.length === 0) {
            el.innerHTML = '<div style="color:#6b6b8a;font-size:0.8rem;padding:10px 0;">No customers found</div>';
            return;
        }
        el.innerHTML = data.customers.map(c => `
            <div class="lookup-row" onclick="manualCheckin(${c.id})">
                <div>
                    <div class="lookup-name">${c.name}</div>
                    <div class="lookup-contact">${c.contact}</div>
                </div>
                <button class="btn-checkin-row" onclick="event.stopPropagation();manualCheckin(${c.id})">
                    <i class="bi bi-check-lg"></i> Check In
                </button>
            </div>`).join('');
    }, 280);
}

async function manualCheckin(customerId) {
    setStatus('scan', '<i class="bi bi-hourglass-split"></i> Logging visit…');
    const res = await fetch(`/customer/${customerId}/visit`, { method: 'POST' });
    const data = await res.json();
    if (data.ok) {
        // Fetch customer name for display
        setStatus('ok', `<i class="bi bi-check-circle-fill"></i> ✅ Visit logged! +10 points`);
        document.getElementById('manual-wrap').style.display = 'none';
    } else {
        setStatus('err', '<i class="bi bi-x-circle"></i> Could not log visit');
    }
}
</script>
</body>
</html>
